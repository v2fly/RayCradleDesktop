name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  LINUX_ROOTFS_SUITE: bookworm
  MAX_GLIBC_VERSION: "2.36"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            goos: windows
            goarch: amd64
            artifact: RayCradleDesktop-windows-amd64
          - name: macOS
            os: macos-latest
            goos: darwin
            goarch: ""
            artifact: RayCradleDesktop-macos
          - name: Linux AppImage
            os: ubuntu-24.04
            goos: linux
            goarch: amd64
            artifact: RayCradleDesktop-linux-amd64-appimage

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Allow Linux unprivileged user namespaces
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "kernel.apparmor_restrict_unprivileged_userns is not present; skipping"
          fi

      - name: Check Linux rootfs prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          command -v unshare
          command -v apt-get
          command -v curl
          command -v dpkg-deb
          command -v file
          command -v strings
          command -v xzcat

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            bash scripts/run-linux-rootfs.sh -- go test -tags gtk3 ./...
          else
            go test ./...
          fi

      - name: Build release artifact
        shell: bash
        env:
          RAYCRADLE_VERSION: ${{ github.ref_name }}
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            bash scripts/run-linux-rootfs.sh -- bash scripts/build-release.sh
          else
            bash scripts/build-release.sh
          fi

      - name: Verify Linux AppImage glibc floor
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/check-appimage-glibc.sh dist/release/RayCradleDesktop-*.AppImage

      - name: Verify Windows binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          exes=(dist/release/*.exe)
          if [[ "${#exes[@]}" -eq 0 ]]; then
            echo "No Windows .exe was produced in dist/release" >&2
            find dist -maxdepth 3 -type f -print >&2 || true
            exit 1
          fi
          for exe in "${exes[@]}"; do
            test -s "${exe}"
            ls -lh "${exe}"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/release/RayCradleDesktop-*
          if-no-files-found: error
