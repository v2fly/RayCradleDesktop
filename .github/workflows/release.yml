name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to release
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            goos: windows
            goarch: amd64
            artifact: RayCradleDesktop-windows-amd64
          - name: macOS
            os: macos-latest
            goos: darwin
            goarch: ""
            artifact: RayCradleDesktop-macos
          - name: Linux AppImage
            os: ubuntu-24.04
            goos: linux
            goarch: amd64
            artifact: RayCradleDesktop-linux-amd64-appimage

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            desktop-file-utils \
            file \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            zip
          sudo apt-get install -y --no-install-recommends libfuse2t64 || \
            sudo apt-get install -y --no-install-recommends libfuse2 || true

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            go test -tags gtk3 ./...
          else
            go test ./...
          fi

      - name: Build release artifact
        shell: bash
        env:
          RAYCRADLE_VERSION: ${{ env.RELEASE_TAG }}
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
        run: bash scripts/build-release.sh

      - name: Verify Windows binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          exes=(dist/release/*.exe)
          if [[ "${#exes[@]}" -eq 0 ]]; then
            echo "No Windows .exe was produced in dist/release" >&2
            find dist -maxdepth 3 -type f -print >&2 || true
            exit 1
          fi
          for exe in "${exes[@]}"; do
            test -s "${exe}"
            ls -lh "${exe}"
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/release/RayCradleDesktop-*.zip
            dist/release/RayCradleDesktop-*.AppImage
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist/release
          merge-multiple: true

      - name: List release assets
        shell: bash
        run: |
          set -euo pipefail
          find dist/release -maxdepth 1 -type f -print -exec ls -lh {} \;

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/release/RayCradleDesktop-*.zip dist/release/RayCradleDesktop-*.AppImage)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No RayCradleDesktop .zip or .AppImage release assets found" >&2
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "RayCradleDesktop ${RELEASE_TAG}" \
              --notes "RayCradleDesktop ${RELEASE_TAG}"
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --verify-tag \
              --title "RayCradleDesktop ${RELEASE_TAG}" \
              --notes "RayCradleDesktop ${RELEASE_TAG}"
          fi
